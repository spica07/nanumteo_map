<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>수집·정제 리포트</title>
<meta name="description" content="전국 공동육아나눔터 수집·정제 현황 요약 리포트">
<meta name="theme-color" content="#C2703D">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icons/app-icon-512.png">
<link rel="apple-touch-icon" href="assets/icons/app-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="나눔터지도">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <svg class="sign-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <rect x="2.6" y="12.4" width="4.4" height="9"/>
      <rect x="9.8" y="7.6" width="4.4" height="13.8"/>
      <rect x="17" y="3.4" width="4.4" height="18"/>
    </svg>
    <div class="sign-text">
      <h1 class="app-title">수집·정제 리포트</h1>
    </div>
    <a class="report-btn" href="index.html">지도로</a>
  </div>
  <p class="app-notice">전국 공동육아나눔터 <span id="totalCount"></span>곳 · 자료 조회일 <span id="surveyDate"></span> · 참고용입니다.</p>
</header>

<main class="container report-page">

  <!-- 핵심 지표 -->
  <section class="panel">
    <h2 class="report-section-title">한눈에 보기</h2>
    <div class="stat-tiles" id="statTiles"></div>
  </section>

  <!-- 지역별 시설 수 -->
  <section class="panel">
    <h2 class="report-section-title">지역별 시설 수</h2>
    <div class="district-bars" id="regionBars"></div>
    <p class="dash-hint">막대를 누르면 지도에서 해당 지역만 볼 수 있어요</p>
  </section>

  <!-- 지역별 상세 표 -->
  <section class="panel">
    <h2 class="report-section-title">지역별 상세</h2>
    <div class="table-wrap">
      <table class="report-table" id="reportTable">
        <thead>
          <tr>
            <th>지역</th><th>시설 수</th><th>시군구 수</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <footer class="app-footer">
    <p>자료: 공공데이터포털 「한국건강가정진흥원 전국 공동육아나눔터 기관현황」 · 원본 대비 제외 건수는 위 지표를 참고하세요.</p>
  </footer>
</main>

<div class="site-notice" role="note">
  © 2026 전국 공동육아나눔터 지도 · 본 사이트는 정보 공유 목적으로 제공됩니다. 시설명·상표 등의 권리는 해당 권리자에게 있습니다.
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/report.js"></script>
</body>
</html>
